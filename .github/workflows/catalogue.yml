name: Synchronize release catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: catalogue
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release manifests and refresh catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/sync_catalog.py
      - name: Commit changed catalogue
        run: |
          if git diff --quiet -- catalog.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m "Update catalogue from published NRF releases"
          git push
