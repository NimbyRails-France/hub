name: Native Hub packages
on:
  push:
    branches: [main, alpha, beta]
  pull_request:
  workflow_dispatch:
    inputs:
      nativePackageVersion:
        description: 'Numeric installer version X.Y.Z (required for alpha/beta builds)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb
      - name: Verify and package on the target OS
        shell: bash
        env:
          NATIVE_PACKAGE_VERSION: ${{ inputs.nativePackageVersion }}
        run: |
          args=()
          if [ -n "$NATIVE_PACKAGE_VERSION" ]; then
            args+=("-PnativePackageVersion=$NATIVE_PACKAGE_VERSION")
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash gradlew prepareRelease "${args[@]}" --console=plain
          else
            bash gradlew prepareRelease "${args[@]}" --console=plain
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hub-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/gradle/release/**
            build/gradle-*/release/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-tests-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/gradle/reports/tests
            build/gradle-*/reports/tests
