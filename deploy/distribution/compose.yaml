name: nrf-distribution
services:
  releases:
    image: caddy@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The official binary carries this file capability, including on port 8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
    tmpfs:
      - /config
      - /data
      - /tmp
    networks:
      proxy:
        aliases: [nrf-releases]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  proxy:
    external: true
